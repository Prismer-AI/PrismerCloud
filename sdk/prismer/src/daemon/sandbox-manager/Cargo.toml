[package]
name = "sandbox-manager"
version = "0.1.0"
description = "Resident Sandbox Manager — supervisor for daemon process in sandbox containers"
edition = "2021"
license = "MIT"

[[bin]]
name = "sandbox-manager"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

[target.'cfg(target_os = "linux")'.dependencies]
inotify = { version = "0.11.4", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
# Static linking for musl targets
opt-level = "s"     # optimize for size (container image)
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 0
